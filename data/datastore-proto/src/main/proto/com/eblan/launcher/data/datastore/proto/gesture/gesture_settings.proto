syntax = "proto3";

import "com/eblan/launcher/data/datastore/proto/gesture/eblan_action.proto";

option java_package = "com.eblan.launcher.data.datastore.proto.gesture";
option java_multiple_files = true;

message GestureSettingsProto {
  EblanActionProto doubleTapProto = 1;
  EblanActionProto swipeUpProto = 2;
  EblanActionProto swipeDownProto = 3;
  EblanActionProto swipeLeftProto = 4;
  EblanActionProto swipeRightProto = 5;
  EblanActionProto doubleTapSwipeUpProto = 6;
  EblanActionProto doubleTapSwipeDownProto = 7;
  EblanActionProto twoFingerSwipeUpProto = 8;
  EblanActionProto twoFingerSwipeDownProto = 9;
  EblanActionProto pinchInProto = 10;
  EblanActionProto pinchOutProto = 11;
  EblanActionProto rotateCounterClockwiseProto = 12;
  EblanActionProto rotateClockwiseProto = 13;
}