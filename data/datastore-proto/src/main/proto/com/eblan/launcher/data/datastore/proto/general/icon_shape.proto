  IconShapeOctagon = 6;
  IconShapeDiamond = 7;
  IconShapePentagon = 8;
  IconShapeClover = 9;
  IconShapeCookie = 10;
  IconShapeFlower = 11;
  IconShapeShield = 12;
  IconShapeSquircle = 13;
  IconShapeLeaf = 14;
  IconShapeArch = 15;
  IconShapeHeart = 16;
  IconShapeStar = 17;
  IconShapeScallop = 18;
  IconShapeCloud = 19;
  IconShapeCat = 20;
  IconShapeGhost = 21;
  IconShapePacMan = 22;
