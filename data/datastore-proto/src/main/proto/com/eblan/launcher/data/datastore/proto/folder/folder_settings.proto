syntax = "proto3";

import "com/eblan/launcher/data/datastore/proto/model/background_color.proto";

option java_package = "com.eblan.launcher.data.datastore.proto.folder";
option java_multiple_files = true;

message FolderSettingsProto {
  int32 folderCellWidth = 1;
  int32 folderCellHeight = 2;
  int32 maxFolderColumns = 3;
  int32 maxFolderRows = 4;
  int32 folderCornerRadius = 5;
  BackgroundColorProto folderBackgroundColorProto = 6;
  int32 customFolderBackgroundColor = 7;
}