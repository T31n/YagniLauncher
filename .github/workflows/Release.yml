name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build_release_apk:
    name: "Build Release APK"
    if: github.repository == 'T31n/YagniLauncher'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the tag commit can be compared with the default branch tip
          fetch-depth: 0

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Apply CI Gradle properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Read version from build.gradle.kts
        id: version
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName *= *"\(.*\)".*/\1/p' app/build.gradle.kts)
          VERSION_CODE=$(sed -n 's/.*versionCode *= *\([0-9]\+\).*/\1/p' app/build.gradle.kts)  
          
          if [ -z "${VERSION_NAME}" ] || [ -z "${VERSION_CODE}" ]; then
            echo "❌ Could not read versionName/versionCode from app/build.gradle.kts"
            exit 1
          fi

          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT

      - name: Validate tag
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Tag format: v<major>.<minor>.<patch> with an optional -suffix, e.g. v1.1.1 or v1.0.9-alpha
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "❌ Tag '${GITHUB_REF_NAME}' must look like v1.1.1 (optionally with a -suffix)"
            exit 1
          fi

          CLEAN_TAG="${GITHUB_REF_NAME#v}"
          if [ "${CLEAN_TAG}" != "${VERSION_NAME}" ]; then
            echo "❌ Tag does not match versionName in build.gradle.kts"
            echo "Tag: ${CLEAN_TAG}"
            echo "Version Name: ${VERSION_NAME}"
            exit 1
          fi

          git fetch --no-tags origin "${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          TAG_SHA=$(git rev-parse "${GITHUB_SHA}^{commit}")
          BRANCH_SHA=$(git rev-parse "origin/${DEFAULT_BRANCH}")
          if [ "${TAG_SHA}" != "${BRANCH_SHA}" ]; then
            echo "❌ Tag must point to the latest commit of ${DEFAULT_BRANCH}"
            echo "Tag commit: ${TAG_SHA}"
            echo "${DEFAULT_BRANCH} tip: ${BRANCH_SHA}"
            exit 1
          fi

          echo "✅ ${GITHUB_REF_NAME} matches versionName and points to the latest ${DEFAULT_BRANCH} commit"

      - name: Check changelog exists
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          FILE_PATH="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          
          if [ ! -f "$FILE_PATH" ]; then
           echo "❌ Missing file for versionCode: $FILE_PATH"
           exit 1
          fi
           echo "✅ Found metadata file: $FILE_PATH"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Upload mapping file
        uses: actions/upload-artifact@v7
        with:
          name: mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt

      - name: Sign release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_release_apk
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Rename signed APK
        run: |
          mv ${{steps.sign_release_apk.outputs.signedReleaseFile}} app/build/outputs/apk/release/YagniLauncher-${{ github.ref_name }}.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/YagniLauncher-${{ github.ref_name }}.apk