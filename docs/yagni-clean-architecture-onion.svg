<svg viewBox="0 0 760 760" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg { fill: #fafaf8; }
      .title { fill: #1f2328; }
      .subtitle { fill: #6b7280; }
      .footer { fill: #9ca3af; }

      .ring-app { fill: #dbeeff; stroke: #60a5fa; }
      .ring-mid { fill: #dcfce7; stroke: #4ade80; }
      .ring-dom { fill: #fef9c3; stroke: #eab308; }

      .divider { stroke: #4ade80; stroke-opacity: 0.75; }
      .arrow { stroke: #475569; }
      .arrow-head { fill: #475569; }

      .lbl-app { fill: #1e40af; }
      .sub-app { fill: #1e40af; }
      .lbl-mid { fill: #166534; }
      .sub-mid { fill: #166534; }
      .lbl-dom { fill: #713f12; }
      .sub-dom { fill: #713f12; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .title { fill: #f0f6fc; }
        .subtitle { fill: #8b949e; }
        .footer { fill: #6e7681; }

        .ring-app { fill: #172554; stroke: #3b82f6; }
        .ring-mid { fill: #143322; stroke: #22c55e; }
        .ring-dom { fill: #3b2f0b; stroke: #eab308; }

        .divider { stroke: #22c55e; stroke-opacity: 0.55; }
        .arrow { stroke: #cbd5e1; }
        .arrow-head { fill: #cbd5e1; }

        .lbl-app { fill: #bfdbfe; }
        .sub-app { fill: #3b82f6; }
        .lbl-mid { fill: #bbf7d0; }
        .sub-mid { fill: #22c55e; }
        .lbl-dom { fill: #fef08a; }
        .sub-dom { fill: #eab308; }
      }
    </style>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.14"/>
    </filter>

    <marker id="inwardArrow" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" class="arrow-head"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="760" rx="16" class="bg"/>

  <!-- Header -->
  <text x="380" y="38" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="700" class="title">Yagni Launcher — Clean Architecture</text>
  <text x="380" y="62" text-anchor="middle" dominant-baseline="central" font-size="13" class="subtitle">Dependencies point inward, toward :domain:*</text>

  <!-- Concentric Onion Rings (center: 380, 405) -->
  <circle cx="380" cy="405" r="300" stroke-width="2" filter="url(#softShadow)" class="ring-app"/>
  <circle cx="380" cy="405" r="210" stroke-width="2" filter="url(#softShadow)" class="ring-mid"/>
  <circle cx="380" cy="405" r="95" stroke-width="2.5" filter="url(#softShadow)" class="ring-dom"/>

  <!-- Dashed peer-sector dividers in the middle ring -->
  <line x1="294" y1="365" x2="190" y2="316" stroke-width="1.5" stroke-dasharray="5 5" class="divider"/>
  <line x1="466" y1="365" x2="570" y2="316" stroke-width="1.5" stroke-dasharray="5 5" class="divider"/>
  <line x1="380" y1="500" x2="380" y2="615" stroke-width="1.5" stroke-dasharray="5 5" class="divider"/>

  <!-- Inward Dependency Rule arrows (crossing ring boundaries along y = 405) -->
  <line x1="138" y1="405" x2="188" y2="405" stroke-width="2" marker-end="url(#inwardArrow)" class="arrow"/>
  <line x1="248" y1="405" x2="298" y2="405" stroke-width="2" marker-end="url(#inwardArrow)" class="arrow"/>
  <line x1="622" y1="405" x2="572" y2="405" stroke-width="2" marker-end="url(#inwardArrow)" class="arrow"/>
  <line x1="512" y1="405" x2="462" y2="405" stroke-width="2" marker-end="url(#inwardArrow)" class="arrow"/>

  <!-- Outer Ring: Entry Point -->
  <text x="380" y="140" text-anchor="middle" dominant-baseline="central" font-family="Consolas, Monaco, monospace" font-size="19" font-weight="700" class="lbl-app">:app</text>
  <text x="380" y="162" text-anchor="middle" dominant-baseline="central" font-size="11.5" class="sub-app">Entry point · Hilt DI · Root navigation</text>

  <!-- Middle Ring: Peer Implementation & Presentation Layers -->
  <text x="380" y="242" text-anchor="middle" dominant-baseline="central" font-family="Consolas, Monaco, monospace" font-size="17.5" font-weight="700" class="lbl-mid">:feature:*</text>
  <text x="380" y="264" text-anchor="middle" dominant-baseline="central" font-size="11.5" class="sub-mid">Compose UI · ViewModels · :ui · :design-system</text>

  <text x="278" y="506" text-anchor="middle" dominant-baseline="central" font-family="Consolas, Monaco, monospace" font-size="17" font-weight="700" class="lbl-mid">:platform</text>
  <text x="278" y="527" text-anchor="middle" dominant-baseline="central" font-size="11" class="sub-mid">System APIs &amp; Services</text>

  <text x="482" y="506" text-anchor="middle" dominant-baseline="central" font-family="Consolas, Monaco, monospace" font-size="17" font-weight="700" class="lbl-mid">:data:*</text>
  <text x="482" y="527" text-anchor="middle" dominant-baseline="central" font-size="11" class="sub-mid">Room &amp; Proto DataStore</text>

  <!-- Inner Core: Pure Kotlin Domain -->
  <text x="380" y="394" text-anchor="middle" dominant-baseline="central" font-family="Consolas, Monaco, monospace" font-size="18.5" font-weight="700" class="lbl-dom">:domain:*</text>
  <text x="380" y="416" text-anchor="middle" dominant-baseline="central" font-size="11" class="sub-dom">Models · Use Cases · Grid</text>

  <!-- Footer -->
  <text x="380" y="738" text-anchor="middle" dominant-baseline="central" font-size="11" class="footer">GPL-3.0 · F-Droid · IzzyOnDroid — inspired by Uncle Bob's Clean Architecture</text>
</svg>
