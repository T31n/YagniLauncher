<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="900" fill="#fafaf8"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2328">Yagni Launcher — Clean Architecture</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#6b7280">Dependencies point inward, toward :domain</text>

  <!-- ============ THE ONION — 3 equal-thickness rings ============ -->
  <circle cx="450" cy="480" r="300" fill="#dbeeff" stroke="#60a5fa" stroke-width="2" filter="url(#softShadow)"/>
  <circle cx="450" cy="480" r="200" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <circle cx="450" cy="480" r="100" fill="#fef9c3" stroke="#eab308" stroke-width="2.5"/>

  <!-- Outer layer label -->
  <text x="450" y="224" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="19" font-weight="700" fill="#1e40af">:app</text>
  <text x="450" y="248" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="19" font-weight="700" fill="#1e40af">:service</text>

  <!-- Merged middle layer — feature / framework / data stacked -->
  <text x="450" y="314" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="18" font-weight="700" fill="#166534">:feature</text>
  <text x="450" y="336" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="18" font-weight="700" fill="#166534">:framework</text>
  <text x="450" y="358" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="18" font-weight="700" fill="#166534">:data</text>

  <!-- Domain label -->
  <text x="450" y="486" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="19" font-weight="700" fill="#713f12">:domain</text>

  <text x="450" y="860" text-anchor="middle" font-size="11" fill="#9ca3af">GPL-3.0 · F-Droid · IzzyOnDroid — inspired by Uncle Bob's Clean Architecture</text>
</svg>
